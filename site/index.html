<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tihole — a terminal UI for Pi-hole v6</title>
<meta name="description" content="tihole. A fast, keyboard-driven terminal UI for managing Pi-hole v6 — dashboard, live query log with one-key allow/block, blocking timers, and full CRUD over domains, groups, clients, adlists and local DNS. One Go binary, zero runtime deps." />
<meta name="color-scheme" content="light dark" />
<link rel="stylesheet" href="page.css" />
<script
  defer src="https://cloud.umami.is/script.js"
  data-website-id="176bd9d4-c88f-4cf4-9ffa-71e83e3edd27"></script>
<script>
  // Set theme before paint — avoid FOUC. Priority:
  // localStorage 'th-theme' (explicit user choice) → OS prefers-color-scheme → dark.
  (function () {
    try {
      var saved = localStorage.getItem('th-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
        return;
      }
    } catch (_) {}
    var dark = !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
</head>

<div id="root"></div>
